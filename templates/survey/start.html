<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Khảo sát sức khỏe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #f4f7f8;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .form-container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #007bff;
            margin-bottom: 30px;
        }

        label {
            font-weight: 500;
            display: block;
            margin-bottom: 6px;
            margin-top: 20px;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .radio-group label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
        }

        button {
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 30px;
            width: 100%;
        }

        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Khảo sát sức khỏe</h2>
    <form method="POST">
        {{ form.hidden_tag() }}

        <label for="age">{{ form.age.label }}</label>
        {{ form.age(class="form-control", placeholder="Nhập tuổi của bạn") }}

        <label>{{ form.gender.label }}</label>
        <div class="radio-group">
            {% for subfield in form.gender %}
                <label>{{ subfield() }} {{ subfield.label.text }}</label>
            {% endfor %}
        </div>

        <div class="checkbox-group">
            <label>{{ form.has_chronic_disease() }} {{ form.has_chronic_disease.label.text }}</label>
            <label>{{ form.smoking() }} {{ form.smoking.label.text }}</label>
        </div>

        {{ form.submit(class="btn btn-success") }}
    </form>
</div>

</body>
</html>
